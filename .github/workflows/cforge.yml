# Fuzz Lab de Vemoris · objetivo: C-Forge (VemorisSoftware/cforge).
#
# Corre en tandas de 5,5 horas, una cada 6 horas: en la práctica no para.
#
# 🔒 CONFIDENCIAL: las vulnerabilidades encontradas NUNCA se publican aquí.
# Este repo es público, así que la corrida no muestra hallazgos en el log,
# no sube artefactos y no abre issues públicos. El reporte y los
# reproductores se envían solo al repo PRIVADO VemorisSoftware/FuzzLab-Reportes
# usando el secreto REPORTES_TOKEN.
#
# Para PARARLO: Settings → Secrets and variables → Actions → Variables →
# crea FUZZ_LAB_ACTIVO con el valor "no". Para reanudarlo, bórrala.

name: Atacar C-Forge

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de ataque (máximo 330)"
        required: false
        default: "330"

permissions:
  contents: read

concurrency:
  group: fuzz-cforge
  cancel-in-progress: false

jobs:
  atacar:
    if: vars.FUZZ_LAB_ACTIVO != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Fuzz Lab
        uses: actions/checkout@v4

      - name: C-Forge (última versión de main)
        uses: actions/checkout@v4
        with:
          repository: VemorisSoftware/cforge
          path: cforge
          fetch-depth: 300      # historia para la bisección

      - name: Compilar C-Forge desde la semilla
        run: make -C cforge build

      - name: Repo privado de reportes
        env:
          REPORTES_TOKEN: ${{ secrets.REPORTES_TOKEN }}
        run: |
          if [ -n "$REPORTES_TOKEN" ]; then
            git clone -q "https://x-access-token:${REPORTES_TOKEN}@github.com/VemorisSoftware/FuzzLab-Reportes.git" privado
          fi

      - name: Atacar (salida confidencial, no se muestra)
        env:
          CFORGE_DIR: cforge
          BASE_RENDIMIENTO: privado/reportes/cforge/rendimiento-base.tsv
          PREVIOS: privado/reportes/cforge
          PRUEBAS_REGRESION: privado/pruebas-regresion/cforge
          MINUTOS: ${{ github.event.inputs.minutos || '330' }}
        run: |
          mkdir -p salida
          sh objetivos/cforge/fuzzlab.sh "$MINUTOS" salida > salida/consola.txt 2>&1 || true
          echo "Corrida terminada. El reporte es confidencial y se envía al repo privado."

      - name: Enviar reporte al repo privado
        run: |
          if [ ! -d privado ]; then
            echo "Falta el secreto REPORTES_TOKEN: el reporte se descarta para no exponerlo."
            exit 0
          fi
          carpeta="reportes/cforge/$(date -u +%Y-%m-%d_%H%M)_corrida-${{ github.run_number }}"
          mkdir -p "privado/$carpeta"
          cp -r salida/. "privado/$carpeta/"
          # Los tiempos de esta corrida son la referencia para la próxima.
          [ -s salida/rendimiento.tsv ] && cp salida/rendimiento.tsv privado/reportes/cforge/rendimiento-base.tsv
          cd privado
          git config user.name "Vemoris Software"
          git config user.email "software@vemoris.cl"
          git add -A
          git commit -q -m "Reporte Fuzz Lab · C-Forge · corrida ${{ github.run_number }}"
          git push -q
          if [ -s "$carpeta/fallas.tsv" ]; then
            {
              head -c 60000 "$carpeta/REPORTE.md"
              echo
              echo "---"
              echo "Reproductores: carpeta \`$carpeta\` de este repo."
            } > ../cuerpo.md
            export GH_TOKEN="${{ secrets.REPORTES_TOKEN }}"
            R=VemorisSoftware/FuzzLab-Reportes
            gh label create cforge --repo "$R" --color D93F0B --description "Fallas en C-Forge" --force > /dev/null
            numero=$(gh issue list --repo "$R" --label cforge --state open --json number --jq '.[0].number')
            if [ -n "$numero" ]; then
              gh issue comment "$numero" --repo "$R" --body-file ../cuerpo.md > /dev/null
            else
              gh issue create --repo "$R" --title "🔬 C-Forge: fallas encontradas" --label cforge --body-file ../cuerpo.md > /dev/null
            fi
          fi
          echo "Reporte enviado al repo privado."

      - name: PR con pruebas de regresión (fallas ya arregladas)
        # Cada falla que vuelve a probarse y ya no falla se guarda como prueba
        # de regresión, en un PR al repo PRIVADO: si la falla vuelve, se ve.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.REPORTES_TOKEN }}
        run: |
          [ -d privado ] && [ -s salida/regresiones.tsv ] || exit 0
          grep -q '^arreglada' salida/regresiones.tsv || exit 0
          cd privado
          git fetch -q origin
          rama="regresiones/corrida-${{ github.run_number }}"
          git checkout -q -b "$rama" origin/HEAD 2>/dev/null || git checkout -q -b "$rama"
          mkdir -p pruebas-regresion/cforge
          nuevas=0
          while IFS="$(printf '\t')" read -r estado firma motor tipo corrida archivo; do
            [ "$estado" = arreglada ] && [ -f "../$archivo" ] || continue
            nombre="$(printf '%s' "$firma" | sha256sum | cut -c1-12)$(echo "$archivo" | sed -n 's/.*\(\.[a-z]*\)$/\1/p')"
            [ -f "pruebas-regresion/cforge/$nombre" ] && continue
            cp "../$archivo" "pruebas-regresion/cforge/$nombre"
            printf '| `%s` | %s | %s | %s |\n' "$nombre" "$motor" "$tipo" "$corrida" >> ../tabla.md
            nuevas=$((nuevas + 1))
          done < ../salida/regresiones.tsv
          [ "$nuevas" -gt 0 ] || exit 0
          git add pruebas-regresion
          git commit -q -m "Pruebas de regresión: $nuevas fallas arregladas en C-Forge"
          git push -q origin "$rama"
          {
            echo "Fuzz Lab volvió a probar estas fallas y **ya no fallan**: quedan como pruebas de regresión."
            echo
            echo "| Prueba | Motor | Tipo | Encontrada en |"
            echo "|---|---|---|---|"
            cat ../tabla.md
          } > ../pr.md
          gh pr create --repo VemorisSoftware/FuzzLab-Reportes --head "$rama" --title "🧪 Pruebas de regresión de C-Forge ($nuevas)" --body-file ../pr.md > /dev/null
          echo "PR de pruebas de regresión creado en el repo privado."
